name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: .spec/tools
          key: ${{ runner.os }}-spec-tools-${{ hashFiles('spec/toolchain.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-spec-tools-
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install Apalache
        run: |
          mkdir -p .spec/tools/bin .spec/tools/apalache
          if [ ! -x .spec/tools/bin/apalache-mc ]; then
            curl -L -o /tmp/apalache.zip \
              https://github.com/apalache-mc/apalache/releases/download/v0.63.0/apalache-0.63.0.zip
            echo "5dcd53dfe118fa5b1433ae74c6b350937c88a01aa2aa4c4cc0f052fe4c63e21d  /tmp/apalache.zip" | sha256sum -c -
            unzip -q /tmp/apalache.zip -d .spec/tools/apalache
            ln -sfn ../apalache/apalache-0.63.0/bin/apalache-mc .spec/tools/bin/apalache-mc
          fi
      - run: bun run spec doctor --fix
      - run: bun run spec doctor
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:workbench
      - run: bun run mvp
